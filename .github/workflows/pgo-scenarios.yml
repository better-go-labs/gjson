name: pgo scenarios

on:
  workflow_dispatch:
    inputs:
      pgoctl-ref:
        description: 'pgoctl git ref to test'
        required: true
        default: 'feat/profile-store-action'

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 1: Action collect + publish to GitHub Releases
  # ─────────────────────────────────────────────────────────────────────────
  scn-1-collect-publishes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          allow-public-profiles: true
          # the short scenario profile is small on purpose; relax the gate so it still publishes
          validate-flags: '--min-samples 500 --min-score 0.3'
          github-token: ${{ github.token }}
      - name: assert
        run: |
          [ "${{ steps.pgo.outputs.has-profile }}" = "true" ] || { echo "expected has-profile=true"; exit 1; }
          [ -n "${{ steps.pgo.outputs.profile-tag }}" ] || { echo "expected non-empty profile-tag"; exit 1; }
          gh release list -R "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${PREFIX}/" || { echo "expected release with prefix $PREFIX"; exit 1; }
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 2: Collect + publish, then restore and build with -pgo=default
  # ─────────────────────────────────────────────────────────────────────────
  scn-2-restore-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo-publish
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          allow-public-profiles: true
          # the short scenario profile is small on purpose; relax the gate so it still publishes
          validate-flags: '--min-samples 500 --min-score 0.3'
          github-token: ${{ github.token }}
      - id: pgo-restore
        uses: ./pgoctl-src
        with:
          profile-mode: restore
          profile-tag-prefix: ${{ env.PREFIX }}
          allow-public-profiles: true
          github-token: ${{ github.token }}
      - name: assert and build
        run: |
          [ "${{ steps.pgo-restore.outputs.has-profile }}" = "true" ] || { echo "expected has-profile=true on restore"; exit 1; }
          PGO_FLAG="${{ steps.pgo-restore.outputs.has-profile == 'true' && 'default.pgo' || 'off' }}"
          [ "$PGO_FLAG" = "default.pgo" ] || { echo "expected PGO_FLAG=default.pgo"; exit 1; }
          go build -pgo="$PGO_FLAG" ./...
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 3: Same-day sequence with quality scores
  # ─────────────────────────────────────────────────────────────────────────
  scn-3-same-day-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-3-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - name: Publish two runs same day with different quality scores
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-03-01 --run-id=100-1 --quality-score=0.70 --json
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-03-01 --run-id=200-1 --quality-score=0.90 --json
      - name: assert
        run: |
          # immutable releases are on: a published .0 cannot be rewritten, so the
          # second same-day publish opens .1 holding both runs. `store publish`
          # then prunes superseded sequences, so the original .0 is removed and
          # only the newest sequence (.1) remains.
          gh release view "$PREFIX/2020-03-01.1" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "expected a .1 release from the second same-day publish (is immutable releases enabled?)"; exit 1; }
          is_draft=$(gh release view "$PREFIX/2020-03-01.1" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          [ "$is_draft" = "false" ] || { echo "expected .1 to be published, not a draft"; exit 1; }
          if gh release view "$PREFIX/2020-03-01.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "expected the superseded .0 to be pruned once .1 was published"; exit 1
          fi
          gh release download "$PREFIX/2020-03-01.1" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir mani --clobber
          test "$(jq '.runs | length' mani/manifest.json)" = "2" || { echo "expected 2 runs in the .1 manifest"; exit 1; }
          test "$(jq -r '.runs[].id' mani/manifest.json | sort | tr '\n' ' ')" = "100-1 200-1 " || { echo "expected .1 manifest to list both runs 100-1 and 200-1"; exit 1; }
          test "$(jq -r '.daily_run' mani/manifest.json)" = "200-1" || { echo "expected daily_run to be the higher-score run 200-1"; exit 1; }
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 4: Publish on non-default branch does not create release
  # ─────────────────────────────────────────────────────────────────────────
  scn-4-no-publish-off-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-4-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          publish-branch: some-other-branch
          allow-public-profiles: true
          github-token: ${{ github.token }}
      - name: assert
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${PREFIX}/" && { echo "should not have published on wrong branch"; exit 1; } || true
          [ "${{ steps.pgo.outcome }}" = "success" ] || { echo "step should still succeed"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 5: Artifact store round-trip
  # ─────────────────────────────────────────────────────────────────────────
  scn-5-artifact-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-5-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Expose the runtime token
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsURL = process.env.ACTIONS_RESULTS_URL || 'https://results.github.com';
            if (!runtimeToken) {
              core.setFailed('ACTIONS_RUNTIME_TOKEN is not available.');
              return;
            }
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken);
            core.exportVariable('ACTIONS_RESULTS_URL', resultsURL);
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo-pub
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          profile-store: artifact
          # the short scenario profile is small on purpose; relax the gate so it still publishes
          validate-flags: '--min-samples 500 --min-score 0.3'
          github-token: ${{ github.token }}
      - id: pgo-restore
        uses: ./pgoctl-src
        with:
          profile-mode: restore
          profile-tag-prefix: ${{ env.PREFIX }}
          profile-store: artifact
          github-token: ${{ github.token }}
      - name: assert
        run: |
          [ "${{ steps.pgo-restore.outputs.has-profile }}" = "true" ] || { echo "expected has-profile=true"; exit 1; }
      - name: Clean up this scenario's artifacts
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-artifacts.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 6: Exclude runs from window
  # ─────────────────────────────────────────────────────────────────────────
  scn-6-exclude-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-6-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - name: Publish two runs with CLI
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-04-01 --run-id=100-1 --json
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-04-02 --run-id=200-1 --json
      - name: Exclude a run and check the manifest marks it excluded
        run: |
          /tmp/pgoctl store exclude \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --pairs="2020-04-01:100-1" --reason="scenario exclude test"
          gh release download "$PREFIX/2020-04-01.0" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir mani --clobber
          test "$(jq -r '.runs[] | select(.id=="100-1") | .excluded' mani/manifest.json)" = "true" || { echo "expected run 100-1 to be marked excluded: true"; exit 1; }
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 7: Service key isolation
  # ─────────────────────────────────────────────────────────────────────────
  scn-7-service-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-7-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - name: Publish with different service names
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --service="svc-a" \
            --profile=cpu.pprof --out=default.pgo --json
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --service="svc-b" \
            --profile=cpu.pprof --out=default.pgo --json
      - name: assert
        run: |
          /tmp/pgoctl store restore \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --service="svc-a" --out=restored-a.pgo --json
          test -s restored-a.pgo || { echo "svc-a profile is empty"; exit 1; }
          /tmp/pgoctl store restore \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --service="svc-b" --out=restored-b.pgo --json
          test -s restored-b.pgo || { echo "svc-b profile is empty"; exit 1; }
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 8: Prune max-profiles=1 keeps newest
  # ─────────────────────────────────────────────────────────────────────────
  scn-8-prune-max1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-8-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - name: Publish two different days
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-04-01 --run-id=100-1 --json
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-04-02 --run-id=200-1 --json
      - name: Prune to max-profiles=1
        run: |
          /tmp/pgoctl store prune \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --today=2020-04-02 --lookback-days=14 --max-profiles=1
      - name: assert
        run: |
          gh release view "$PREFIX/2020-04-01.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "prune should have removed 2020-04-01"; exit 1; } || true
          gh release view "$PREFIX/2020-04-02.0" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "prune should keep 2020-04-02"; exit 1; }
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 9: No source (exit 2)
  # ─────────────────────────────────────────────────────────────────────────
  scn-9-no-source-exit2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-9-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-tag-prefix: ${{ env.PREFIX }}
          allow-public-profiles: true
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: assert
        run: |
          [ "${{ steps.pgo.outcome }}" = "failure" ] || { echo "expected the Action to fail with no source"; exit 1; }
          /tmp/pgoctl --version >/dev/null || { echo "pgoctl install should have succeeded"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 10: Gate fails (warn mode, no publish)
  # ─────────────────────────────────────────────────────────────────────────
  scn-10-gate-warn-no-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-10-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          validate-flags: '--min-score 0.99'
          on-gate-failure: warn
          allow-public-profiles: true
          github-token: ${{ github.token }}
      - name: assert
        run: |
          [ "${{ steps.pgo.outcome }}" = "success" ] || { echo "expected warn mode to succeed"; exit 1; }
          gh release list -R "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${PREFIX}/" && { echo "should not have published"; exit 1; } || true

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 11: Gate fails (fail mode)
  # ─────────────────────────────────────────────────────────────────────────
  scn-11-gate-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-11-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          validate-flags: '--min-score 0.99'
          on-gate-failure: fail
          allow-public-profiles: true
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: assert
        run: |
          [ "${{ steps.pgo.outcome }}" = "failure" ] || { echo "expected fail mode to fail the job"; exit 1; }
          [ -n "${{ steps.pgo.outputs.validate-score }}" ] || { echo "expected a non-empty validate-score"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 12: Denied (contents: read only)
  # ─────────────────────────────────────────────────────────────────────────
  scn-12-denied-contents-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-12-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: cpu.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          allow-public-profiles: true
          # relax the gate so the publish is actually attempted (and then denied by contents: read)
          validate-flags: '--min-samples 500 --min-score 0.3'
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: assert
        run: |
          [ "${{ steps.pgo.outcome }}" = "failure" ] || { echo "expected the Action publish to fail without contents: write"; exit 1; }
          set +e
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo --json 2>err.txt
          code=$?
          set -e
          cat err.txt
          [ "$code" -eq 1 ] || { echo "expected CLI publish exit 1, got $code"; exit 1; }
          grep -q "contents: write" err.txt || { echo "expected the error to name contents: write"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 13: Restore from empty store returns has-profile=false
  # ─────────────────────────────────────────────────────────────────────────
  scn-13-empty-store-off:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-13-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-mode: restore
          profile-tag-prefix: ${{ env.PREFIX }}
          allow-public-profiles: true
          github-token: ${{ github.token }}
      - name: assert and build
        run: |
          [ "${{ steps.pgo.outputs.has-profile }}" = "false" ] || { echo "expected has-profile=false"; exit 1; }
          PGO_FLAG="${{ steps.pgo.outputs.has-profile == 'true' && 'default' || 'off' }}"
          [ "$PGO_FLAG" = "off" ] || { echo "expected PGO_FLAG=off"; exit 1; }
          go build -pgo=off ./...

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 14: Missing profile file
  # ─────────────────────────────────────────────────────────────────────────
  scn-14-missing-file:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-14-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: does-not-exist.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          on-gate-failure: fail
          allow-public-profiles: true
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: assert
        run: |
          [ "${{ steps.pgo.outcome }}" = "failure" ] || { echo "expected failure for the missing profile-file"; exit 1; }
          /tmp/pgoctl --version >/dev/null || { echo "pgoctl install should have succeeded"; exit 1; }
          [ ! -f does-not-exist.pprof ] || { echo "guard: the fixture should be absent"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 15: Malformed profile (LFS fixture)
  # ─────────────────────────────────────────────────────────────────────────
  scn-15-malformed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-15-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - id: pgo
        uses: ./pgoctl-src
        with:
          profile-file: pgoctl-src/testdata/cpu_malformed.pprof
          profile-tag-prefix: ${{ env.PREFIX }}
          on-gate-failure: fail
          allow-public-profiles: true
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: assert
        run: |
          [ "${{ steps.pgo.outcome }}" = "failure" ] || { echo "expected the malformed profile to fail the gate in fail mode"; exit 1; }
          gh release list -R "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -E "^${PREFIX}/" && { echo "a gate-failed run must not publish a release"; exit 1; } || true

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 16: Releases store, immutable same-day sequence, restore + prune
  #
  # Immutable releases are enabled on this repo, so a published .0 cannot be
  # rewritten. A second same-day publish opens .1. Restore must pick the highest
  # published sequence (.1), and prune must drop the superseded .0 while keeping
  # the protected .1. Uses a unique run-scoped prefix because an immutable tag
  # can never be reused.
  # ─────────────────────────────────────────────────────────────────────────
  scn-16-release-immutable-restore-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-16-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - name: Publish two runs on one day
        run: |
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-03-01 --run-id=100-1 --quality-score=0.70 --json
          /tmp/pgoctl store publish \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-03-01 --run-id=200-1 --quality-score=0.90 --json
      - name: Restore picks the highest published sequence (.1)
        run: |
          /tmp/pgoctl store restore \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --out=restored.pgo --json >restore.json
          test -s restored.pgo || { echo "restored profile is empty"; exit 1; }
          tag=$(jq -r '.tag' restore.json)
          seq=$(jq -r '.sequence' restore.json)
          echo "restore resolved tag=$tag sequence=$seq"
          [ "$tag" = "$PREFIX/2020-03-01.1" ] || { echo "expected restore to use the .1 tag, got $tag"; exit 1; }
          [ "$seq" = "1" ] || { echo "expected restore sequence 1, got $seq"; exit 1; }
      - name: Prune drops the superseded .0 and keeps .1
        run: |
          /tmp/pgoctl store prune \
            --store=github-release --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --today=2020-03-01 --lookback-days=14 --max-profiles=1
          if gh release view "$PREFIX/2020-03-01.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "prune should have removed the superseded .0"; exit 1
          fi
          gh release view "$PREFIX/2020-03-01.1" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "prune must keep the protected .1"; exit 1; }
      - name: Clean up this scenario's releases
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-releases.sh" "$PREFIX"'

  # ─────────────────────────────────────────────────────────────────────────
  # Scenario 17: Artifacts store, immutable same-day sequence
  #
  # Published Actions Artifacts are always immutable, so a second same-day
  # publish opens .1 holding both runs. Assert both artifacts exist, that the
  # .1 manifest lists both runs, and that restore picks .1.
  # ─────────────────────────────────────────────────────────────────────────
  scn-17-artifact-immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PREFIX: profile/scn-17-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: better-go-labs/pgoctl
          ref: ${{ inputs.pgoctl-ref }}
          path: pgoctl-src
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build pgoctl (confirm toolchain and install)
        run: |
          go build -C pgoctl-src -o /tmp/pgoctl ./cmd/pgoctl
          /tmp/pgoctl --version
      - name: Expose the runtime token
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsURL = process.env.ACTIONS_RESULTS_URL || 'https://results.github.com';
            if (!runtimeToken) {
              core.setFailed('ACTIONS_RUNTIME_TOKEN is not available.');
              return;
            }
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken);
            core.exportVariable('ACTIONS_RESULTS_URL', resultsURL);
      - name: Produce a profile
        run: go test -run '^$' -bench . -benchtime 2s -cpuprofile cpu.pprof .
      - name: Publish two runs on one day to the artifact store
        run: |
          /tmp/pgoctl store publish \
            --store=artifact --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-03-01 --run-id=100-1 --quality-score=0.70 --json
          /tmp/pgoctl store publish \
            --store=artifact --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --profile=cpu.pprof --out=default.pgo \
            --today=2020-03-01 --run-id=200-1 --quality-score=0.90 --json
      - name: assert the .1 artifact supersedes .0 and restore picks .1 with both runs
        run: |
          # Published Actions Artifacts are immutable, so the second same-day
          # publish opens .1 holding both runs. `store publish` prunes superseded
          # sequences, so the .0 artifact is removed and only .1 remains.
          WIRE="${PREFIX//\//_}"
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" --jq '.artifacts[] | select(.expired==false) | .name')
          echo "$names" | grep -qx "${WIRE}_2020-03-01.1" || { echo "expected artifact ${WIRE}_2020-03-01.1"; echo "$names"; exit 1; }
          if echo "$names" | grep -qx "${WIRE}_2020-03-01.0"; then
            echo "expected the superseded .0 artifact to be pruned once .1 was published"; echo "$names"; exit 1
          fi
          /tmp/pgoctl store restore \
            --store=artifact --repo="$GITHUB_REPOSITORY" \
            --tag-prefix="$PREFIX" --out=restored.pgo --json >restore.json
          test -s restored.pgo || { echo "restored profile is empty"; exit 1; }
          tag=$(jq -r '.tag' restore.json)
          echo "restore resolved tag=$tag"
          [ "$tag" = "$PREFIX/2020-03-01.1" ] || { echo "expected restore to use the .1 tag, got $tag"; exit 1; }
          test "$(jq '.runs | length' restore.json)" = "2" || { echo "expected the .1 manifest to list both runs"; exit 1; }
          test "$(jq -r '.runs[].id' restore.json | sort | tr '\n' ' ')" = "100-1 200-1 " || { echo "expected the .1 manifest to list runs 100-1 and 200-1"; exit 1; }
      - name: Clean up this scenario's artifacts
        if: always()
        run: '"${{ github.workspace }}/pgoctl-src/hack/store-e2e/cleanup-artifacts.sh" "$PREFIX"'
