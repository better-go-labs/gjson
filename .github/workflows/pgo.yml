name: pgo

on:
  push:
    branches: [master]
  pull_request:

jobs:
  profile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pgo-profile-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -bench . -benchtime 45s -cpuprofile cpu.pprof .
      - uses: better-go-labs/pgoctl@feat/profile-store-action
        with:
          profile-file: cpu.pprof
          allow-public-profiles: true
          on-gate-failure: warn
          # micro-benchmark profiles score about 0.58 to 0.61, below the 0.6 default gate
          validate-flags: '--min-score 0.5'

  build:
    needs: profile
    if: always() && (needs.profile.result == 'success' || needs.profile.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: better-go-labs/pgoctl@feat/profile-store-action
        id: pgo
        with:
          profile-mode: restore
          allow-public-profiles: true
      - run: go build -pgo=${{ steps.pgo.outputs.has-profile == 'true' && 'default.pgo' || 'off' }} ./...
      - run: |
          echo "has-profile: ${{ steps.pgo.outputs.has-profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "profile-tag: ${{ steps.pgo.outputs.profile-tag }}" >> "$GITHUB_STEP_SUMMARY"
